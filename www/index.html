<!doctype html>
<html lang="ja"><head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5299105289926383"
     crossorigin="anonymous"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>うたストック | カラオケ曲管理</title><style>
:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:#f4f3ff;background:#101326}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 85% 0%,#343064 0%,transparent 48%),#101326}.wrap{max-width:820px;margin:auto;padding:28px 18px 80px}.top{display:flex;align-items:center;gap:12px;margin-bottom:32px}.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#9b7cff,#ff82bd);display:grid;place-items:center;font-size:26px}.muted{color:#a9a9c2}.top h1{margin:0;font-size:23px}.top p{margin:2px 0 0;font-size:12px}.hero{padding:24px 0 16px}.hero h2{font-size:clamp(26px,6vw,38px);margin:0 0 8px}.hero p{margin:0;color:#b6b5cd}.toolbar{display:flex;gap:10px;margin:25px 0 20px;flex-wrap:wrap}input{background:#22263e;border:1px solid #3a3c5b;color:#fff;padding:13px 15px;border-radius:12px;font:inherit;min-width:0}input::placeholder{color:#9394b1}input:focus{outline:2px solid #a891ff}.search{flex:1;min-width:170px}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;font-weight:700}button.primary{background:#a68aff;color:#161029}button.secondary{background:#2a2c48;color:#f3efff}button.ghost{background:transparent;color:#c9bbff;border:1px solid #535071}button.danger{background:#4b293e;color:#ffc4d4}.stats{display:flex;gap:12px;margin:12px 0 26px}.stat{background:#20233a;border:1px solid #323550;border-radius:16px;padding:15px 20px;min-width:120px}.stat b{font-size:25px;display:block}.stat span{color:#b2b0ca;font-size:12px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}.section-head h3{margin:0;font-size:18px}.artist{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:#20243b;color:white;border:1px solid #353854;padding:17px;margin:10px 0;border-radius:17px}.artist:hover,.song:hover{border-color:#8f7ad5}.avatar{width:46px;height:46px;border-radius:13px;background:#3b345c;display:grid;place-items:center;font-size:23px}.artist .name{font-size:17px;font-weight:750}.artist .count{font-size:12px;color:#aaa9c3;margin-top:3px}.chevron{margin-left:auto;color:#bbb1e5;font-size:22px}.back{padding:8px 0;background:transparent;color:#c9bcff}.song{display:flex;align-items:center;gap:12px;background:#20243b;border:1px solid #353854;padding:16px;border-radius:15px;margin:9px 0}.song .number{color:#a38ef1;font-weight:700;width:26px}.song .title{flex:1;font-weight:650;overflow-wrap:anywhere}.small{padding:8px 10px;font-size:13px}.empty{border:1px dashed #565371;border-radius:18px;padding:30px;text-align:center;color:#b8b3d2}.panel{background:#20243b;border:1px solid #454361;border-radius:19px;padding:22px;margin:18px 0}.panel h3{margin:0 0 16px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;color:#c6c1dc;margin-bottom:7px}.field input{width:100%}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.hidden{display:none!important}.notice{font-size:12px;color:#aaa8c5;margin-top:30px;line-height:1.7}@media(max-width:540px){.fields{grid-template-columns:1fr}.wrap{padding:20px 15px 60px}.toolbar button{width:100%}.stats{gap:9px}.stat{flex:1;min-width:0;padding:13px}}
</style></head><body><main class="wrap"><header class="top"><div class="logo">🎤</div><div><h1>うたストック</h1><p>歌える曲を、ひとつずつ。</p></div></header><section class="hero"><h2 id="heading">あなたのカラオケ帳 🎶</h2><p id="subtitle">歌える曲をアーティスト別に整理しよう。</p></section><div class="stats"><div class="stat"><b id="artistCount">0</b><span>アーティスト</span></div><div class="stat"><b id="songCount">0</b><span>登録した曲</span></div></div><div class="toolbar"><input id="search" class="search" placeholder="🔎  アーティストや曲名を検索" aria-label="検索"><button class="primary" id="addBtn">＋ 曲を追加</button></div><section id="editor" class="panel hidden"><h3 id="editorTitle">曲を追加する</h3><form id="songForm"><div class="fields"><div class="field"><label for="artistInput">アーティスト名</label><input id="artistInput" required maxlength="100" placeholder="例：Mrs. GREEN APPLE"></div><div class="field"><label for="songInput">曲名</label><input id="songInput" required maxlength="150" placeholder="例：天国"></div></div><div class="actions"><button type="button" class="secondary" id="cancelBtn">キャンセル</button><button type="submit" class="primary" id="saveBtn">保存する</button></div></form></section><div id="content"></div><section class="panel"><h3>データのバックアップ</h3><p class="notice">機種変更やデータ消去に備えて、曲一覧をJSONファイルで保存できます。</p><div class="actions"><button type="button" class="secondary" id="exportBtn">書き出す</button><button type="button" class="secondary" id="importBtn">読み込む</button><input type="file" id="importFile" accept="application/json,.json" hidden></div></section><p class="notice">※ 登録・編集した内容は、このブラウザ内に自動保存されます。別の端末やブラウザには自動同期されません。ブラウザのデータを消去すると登録内容も消える場合があります。</p></main><script>
(()=>{'use strict';const KEY='utastock_songs_v1';const initial=[];let songs;try{const v=JSON.parse(localStorage.getItem(KEY));songs=Array.isArray(v)?v:initial.slice()}catch{songs=initial.slice()}let selected=null,editing=null;const $=id=>document.getElementById(id), coll=new Intl.Collator('ja',{sensitivity:'base',numeric:true});const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(songs))}catch{alert('保存できませんでした。ブラウザの保存設定をご確認ください。')}};const el=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n};function openEditor(song){editing=song?.id??null;$('editorTitle').textContent=song?'曲を編集する':'曲を追加する';$('artistInput').value=song?.artist??selected??'';$('songInput').value=song?.title??'';$('editor').classList.remove('hidden');$('artistInput').focus();$('editor').scrollIntoView({behavior:'smooth',block:'nearest'})}function closeEditor(){$('editor').classList.add('hidden');editing=null;$('songForm').reset()}function render(){const q=$('search').value.trim().toLocaleLowerCase();$('artistCount').textContent=new Set(songs.map(s=>s.artist)).size;$('songCount').textContent=songs.length;const content=$('content');content.replaceChildren();if(selected!==null){$('heading').textContent=selected;$('subtitle').textContent='登録した曲をあいうえお順で表示しています。';const back=el('button','back','← アーティスト一覧に戻る');back.onclick=()=>{selected=null;$('search').value='';closeEditor();render()};content.append(back);const matches=songs.filter(s=>s.artist===selected&&s.title.toLocaleLowerCase().includes(q)).sort((a,b)=>coll.compare(a.title,b.title));const sh=el('div','section-head');sh.append(el('h3','',`曲一覧（${matches.length}曲）`));content.append(sh);if(!matches.length)content.append(el('div','empty','曲がありません。＋ 曲を追加から登録できます。'));matches.forEach((s,i)=>{const row=el('div','song');row.append(el('span','number',String(i+1).padStart(2,'0')),el('span','title',s.title));const edit=el('button','secondary small','編集');edit.onclick=()=>openEditor(s);const del=el('button','danger small','削除');del.onclick=()=>{if(confirm(`「${s.title}」を削除しますか？`)){songs=songs.filter(x=>x.id!==s.id);save();render()}};row.append(edit,del);content.append(row)})}else{$('heading').textContent='あなたのカラオケ帳 🎶';$('subtitle').textContent='歌える曲をアーティスト別に整理しよう。';const artists=[...new Set(songs.map(s=>s.artist))].sort(coll.compare).filter(a=>a.toLocaleLowerCase().includes(q)||songs.some(s=>s.artist===a&&s.title.toLocaleLowerCase().includes(q)));const sh=el('div','section-head');sh.append(el('h3','','アーティスト一覧'));content.append(sh);if(!artists.length)content.append(el('div','empty','該当するアーティストがありません。曲を追加してみよう！'));artists.forEach(a=>{const btn=el('button','artist');btn.append(el('span','avatar','🎵'));const box=el('div');box.append(el('div','name',a),el('div','count',`${songs.filter(s=>s.artist===a).length}曲登録`));btn.append(box,el('span','chevron','›'));btn.onclick=()=>{selected=a;$('search').value='';closeEditor();render()};content.append(btn)})}}$('addBtn').onclick=()=>openEditor();$('cancelBtn').onclick=closeEditor;$('search').addEventListener('input',render);$('songForm').onsubmit=e=>{e.preventDefault();const artist=$('artistInput').value.trim(),title=$('songInput').value.trim();if(!artist||!title)return;if(editing){const s=songs.find(x=>x.id===editing);if(s){s.artist=artist;s.title=title}}else{songs.push({id:(typeof crypto!=='undefined'&&typeof crypto.randomUUID==='function')?crypto.randomUUID():String(Date.now())+Math.random(),artist,title})}save();closeEditor();if(selected!==null&&selected!==artist)selected=artist;render()};$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,songs},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='utastock-backup.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.songs)||data.songs.length>50000||!data.songs.every(x=>typeof x.artist==='string'&&typeof x.title==='string'&&x.artist.length<=100&&x.title.length<=150))throw Error('invalid');if(!confirm('現在の曲一覧をバックアップの内容で置き換えますか？'))return;songs=data.songs.map(x=>({id:String(x.id||Date.now()+Math.random()),artist:x.artist,title:x.title}));selected=null;save();render();alert('読み込みました')}catch{alert('読み込めないファイルです')}finally{e.target.value=''}};
render()})();
</script></body></html>
